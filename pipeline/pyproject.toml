[project]
name = "semantic-wordcloud"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jixian Li", email = "ljx.sci@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "en-core-web-sm",
    "httpx>=0.28.1",
    "icalendar>=7.3.2",
    "lxml>=6.1.3",
    "nltk>=3.10.4",
    "pypdf>=7.1.1",
    "sentence-transformers>=6.3.0",
    "spacy>=3.8.18",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[project.scripts]
collect-corpus = "semantic_wordcloud.collect_corpus:main"
build-terms = "semantic_wordcloud.build_terms:main"
build-semantics = "semantic_wordcloud.build_semantics:main"
