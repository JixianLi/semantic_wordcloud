[project]
name = "corpus-fetch"
version = "0.1.0"
description = "Rate-limited, cached fetchers for the VIS 2026 and SC26 web content and open-access preprints"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "icalendar>=7.3.2",
    "lxml>=6.1.3",
    "pypdf>=7.1.1",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project.scripts]
fetch-web = "corpus_fetch.fetch_web:main"
fetch-papers = "corpus_fetch.fetch_papers:main"
